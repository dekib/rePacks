version: '3.9'

services:
  app:
    build: .
    ports:
      - "8086:8086"
    volumes:
      - ./ui:/app/ui  # Mount UI for development
    environment:
      - PORT=8086
      - GIN_MODE=release
    restart: unless-stopped

